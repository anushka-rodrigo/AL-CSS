<!DOCTYPE html>
<html>
<head>
    <title>CSS border colors</title>
    <style>
        p.one {
            border-style: solid;
            border-color: red;
        }
        p.two {
            border-style: solid;
            border-color: #00ff00;
        }
        p.three {
            border-style: solid;
            border-color: rgb(0,0,255);
        }
        p.four {
            border-style: solid;
            border-color: hsl(24,100%,50%);
        }

        h3 {
            border: 3px dashed limegreen;
            /*width style color*/
        }
    </style>
</head>
<body>
    <p class="one">A red border</p>
    <p class="two">A hex-color border</p>
    <p class="three">A rgb-color border</p>
    <p class="four">A hsl-color border</p><br>

    <h3>Border shorthand</h3>
</body>
</html>
