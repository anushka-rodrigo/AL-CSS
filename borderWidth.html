<!DOCTYPE html>
<html>
<head>
    <title>CSS border styles</title>
    <style>
        p.px5 {
            border-style: solid;
            border-width: 5px;
        }
        p.medium {
            border-style: solid;
            border-width: medium;
        }
        p.thick {
            border-style: solid;
            border-width: thick;
        }
        p.mixed {
            border-style: solid;
            /*top right bottom left*/
            border-width: 5px medium 2px 10px;
        } 

        a{
            border-style: solid;
            border-width: 1px;
        }
    </style>
</head>
<body>
    <p class="px5">A 5px border</p>
    <p class="medium">A medium border</p>
    <p class="thick">A thick border</p>
    <p class="mixed">A mixed border</p>

    <a href="www.facebook.com">test</a>
</body>
</html>
