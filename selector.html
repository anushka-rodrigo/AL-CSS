<!DOCTYPE html>
<html>
<head>
    <title>CSS selectors</title>
    <style>

        * {border: 1px solid black;} /*select all*/

        h1 {color: green;} /*element selector*/

        #heading1 {color: blueviolet;} /*id selector*/

        .heading2 {color: brown;} /*class selector*/

        h2,h3,p {color: chocolate;} /*group selector*/

    </style>
</head>
<body>
    <h1>Element selector</h1><br>

    <h1 id="heading1">ID selector</h1><br>

    <h1 class="heading2">class selector</h1><br><br>

    <h2>Group selector</h2><br>
    <h3>Group selector</h3><br>
    <p>Group selector</p><br>
    
</body>
</html>
