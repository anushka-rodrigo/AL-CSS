<!DOCTYPE html>
<html>
<head>
    <title>Inserting CSS</title>
    <link rel="stylesheet" href="insertingStyles.css" type="text/css"> <!--External CSS file link-->
    <style>
        h2 {color: blue;}
        p {
            color:blueviolet; 
            border: 1px solid red;
        }
    </style>
</head>
<body>

    <h1>External CSS</h1><br>

    <h2>Internal CSS</h2><br>
    
    <h3 style="color: green;">Inline CSS</h3><br>

    <p style="color:darkgoldenrod;">Cascade order: Inline -> Internal -> External </p>
</body>
</html>
