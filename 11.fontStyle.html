<!DOCTYPE html>
<html>
<head>
    <title>CSS font style</title>
    <style>
        p.p1 {font-style: normal;}
        p.p2 {font-style: italic;}
        p.p3 {font-style: oblique;}
    </style>
</head>
<body>
    <p class="p1">A normal font</p>
    <p class="p2">A italic font</p>
    <p class="p3">A obilique font</p>
</body>
</html>
