<!DOCTYPE html>
<html>
<head>
    <title>CSS colors</title>
    <style>
        /*
        Ways to applly colors:-
            Color name
            Hex value
            RGB value
            HSL values
        */
        #name {color: mediumseagreen;}
        #hex {color: #ff6347;}
        #rgb {color: rgb(78, 2, 241);}
        #hsl {color: hsl(9, 100%, 64%);}
    </style>
</head>
<body>
    <h1 id="name">Color name</h1>
    <h1 id="hex">Hex value</h1>
    <h1 id="rgb">RGB value</h1>
    <h1 id="hsl">HSL value</h1>
</body>
</html>
