<!DOCTYPE html>
<html>
<head>
    <title>CSS border radius</title>
    <style>
        p.normal {
            border: 1px solid black;
        }
        p.round1 {
            border: 1px solid black;
            border-radius: 5px;
        }
        p.round2 {
            border: 1px solid black;
            border-radius: 10px;
        }
        p.round3 {
            border: 1px solid black;
            border-radius: 50px;
        }

        a {
            border: 1px solid black;
            border-radius: 150%;
        }
    </style>
</head>
<body>
    <p class="normal">A normal border</p>
    <p class="round1">Round border 1</p>
    <p class="round2">Round border 2</p>
    <p class="round3">Round border 3</p><br>

    <a href="www.facebook.com">test</a>
</body>
</html>
