<!DOCTYPE html>
<html>
<head>
    <title>CSS font family</title>
    <style>
        p.p1 {font-family: 'Times New Roman', 'Times', serif;}
        p.p2 {font-family: Arial, Helvetica, sans-serif;}
        p.p3 {font-family: 'Lucida Console','Courier New', monospace;}
    </style>
</head>
<body>
    <p class="p1">A times font</p>
    <p class="p2">A arial font</p>
    <p class="p3">A courier new font</p>
</body>
</html>
