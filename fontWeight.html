<!DOCTYPE html>
<html>
<head>
    <title>CSS font weight</title>
    <style>
        p.p1 {font-weight: normal;}
        p.p2 {font-weight: lighter;}
        p.p3 {font-weight: bold;}
        p.p4 {font-weight: 900;}
    </style>
</head>
<body>
    <p class="p1">A normal font</p>
    <p class="p2">A light font</p>
    <p class="p3">A bold font</p>
    <p class="p4">A 900 weight font</p>
</body>
</html>
