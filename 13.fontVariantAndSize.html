<!DOCTYPE html>
<html>
<head>
    <title>CSS font variant and size</title>
    <style>
        p.p1 {font-variant: normal;}
        p.p2 {font-variant: small-caps;}

        p.p3 {font-size: 40px;}
        p.p4 {font-size: 2.5em;} /*1 em = 16 px */
        p.p5 {font-size: 10vm;} /* 1 vm (viewport width) = 0.5 cm */
    </style>
</head>
<body>
    <p class="p1">A normal font</p>
    <p class="p2">A small caps font</p><br>

    <p class="p3">A 40px font</p>
    <p class="p4">A 2.5em font</p>
    <p class="p5">A 10vm font</p>
</body>
</html>
